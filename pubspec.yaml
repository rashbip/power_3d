name: power3d
description: "A powerful, industry-level 3D model viewer for Flutter using Babylon.js. Supports advanced controls, lighting, and object selection."
homepage: https://github.com/rashbip/power_3d
repository: https://github.com/rashbip/power_3d
issue_tracker: https://github.com/rashbip/power_3d/issues
topics:
  - three-d
  - babylonjs
  - model-viewer
  - flutter
  - graphics
version: 2.1.0
environment:
  sdk: ^3.10.8
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_inappwebview: ^6.1.5
  path: ^1.9.0
  path_provider: ^2.1.5
  meta: ^1.11.0
  archive: ^3.6.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/power3d_assets.zip